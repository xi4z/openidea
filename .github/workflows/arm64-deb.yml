name: Build arm64 deb

on:
  workflow_dispatch:
  push:
    branches: [arm64-deb]

permissions:
  contents: write

jobs:
  deb-arm64:
    name: Debian package (arm64)
    runs-on: ubuntu-24.04-arm
    # Build on Debian 12 so the binary links against glibc 2.36, not the
    # runner image's 2.39: a bookworm-built .deb runs on Debian 12/13 and
    # Ubuntu 24.04+.
    container: node:22-bookworm
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: System dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential ca-certificates curl file pkg-config patchelf \
            libssl-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev

      - name: Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --default-toolchain stable --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: pnpm
        run: npm install -g pnpm@11

      - uses: Swatinem/rust-cache@v2
        with:
          key: debian12-aarch64

      - name: Build frontend
        run: pnpm install --frozen-lockfile && pnpm build

      # Upstream creates signed updater artifacts, which needs a signing key.
      # A locally redistributed .deb does not, so turn that off here.
      - name: Updater artifacts off
        run: echo '{"bundle":{"createUpdaterArtifacts":false}}' > /tmp/tauri.arm64.json

      - name: Build arm64 deb
        run: pnpm tauri build --target aarch64-unknown-linux-gnu --bundles deb --config /tmp/tauri.arm64.json

      - name: Inspect artifact
        run: |
          set -euo pipefail
          deb=$(ls target/aarch64-unknown-linux-gnu/release/bundle/deb/*.deb)
          file target/aarch64-unknown-linux-gnu/release/openidea
          dpkg-deb -I "$deb" | sed -n '1,20p'
          echo "-- contained files --"
          dpkg-deb -c "$deb" | grep -E 'bin/|\.so' | head -20
          echo "-- max glibc symbol version --"
          grep -ao 'GLIBC_2\.[0-9]*' target/aarch64-unknown-linux-gnu/release/openidea \
            | sort -uV | tail -3
          echo "-- max GLIBCXX --"
          grep -ao 'GLIBCXX_3\.4\.[0-9]*' target/aarch64-unknown-linux-gnu/release/openidea \
            | sort -uV | tail -3 || true

      - name: Publish to a release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          deb=$(ls target/aarch64-unknown-linux-gnu/release/bundle/deb/*.deb)
          name=$(basename "$deb")
          tag="v$(jq -r .version src-tauri/tauri.conf.json)-arm64"
          gh release view "$tag" >/dev/null 2>&1 || \
            gh release create "$tag" --title "OpenIDEA ${tag#v} (Debian arm64)" \
              --notes "arm64 build of OpenIDEA for Debian 12+/Ubuntu 24.04+, built on a native aarch64 runner against glibc 2.36.
          Install: sudo apt install ./$name"
          gh release upload "$tag" "$deb" --clobber
          sha256sum "$deb" > "$deb.sha256"
          gh release upload "$tag" "$deb.sha256" --clobber
          echo "https://github.com/${{ github.repository }}/releases/download/$tag/$name"