name: Build arm64 deb

on:
  workflow_dispatch:
  push:
    branches: [arm64-deb]

permissions:
  contents: write

jobs:
  deb-arm64:
    name: Debian package (arm64)
    runs-on: ubuntu-24.04-arm
    # Build on Debian 12 so the binary links against glibc 2.36, not the
    # runner image's 2.39: a bookworm-built .deb runs on Debian 12/13 and
    # Ubuntu 24.04+.
    container: node:22-bookworm
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: System dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential ca-certificates curl file jq pkg-config patchelf \
            libssl-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev

      - name: Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --default-toolchain stable --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: pnpm
        run: npm install -g pnpm@11

      - uses: Swatinem/rust-cache@v2
        with:
          key: debian12-aarch64

      - name: Build frontend
        run: pnpm install --frozen-lockfile && pnpm build

      # Upstream creates signed updater artifacts, which needs a signing key.
      # A locally redistributed .deb does not, so turn that off here.
      - name: Updater artifacts off
        run: echo '{"bundle":{"createUpdaterArtifacts":false}}' > /tmp/tauri.arm64.json

      - name: Build arm64 deb
        run: pnpm tauri build --target aarch64-unknown-linux-gnu --bundles deb --config /tmp/tauri.arm64.json

      - name: Inspect artifact
        run: |
          set -euo pipefail
          deb=$(ls target/aarch64-unknown-linux-gnu/release/bundle/deb/*.deb)
          file target/aarch64-unknown-linux-gnu/release/openidea
          dpkg-deb -I "$deb" | sed -n '1,20p'
          echo "-- contained files --"
          dpkg-deb -c "$deb" | grep -E 'bin/|\.so' | head -20
          echo "-- max glibc symbol version --"
          grep -ao 'GLIBC_2\.[0-9]*' target/aarch64-unknown-linux-gnu/release/openidea \
            | sort -uV | tail -3
          echo "-- max GLIBCXX --"
          grep -ao 'GLIBCXX_3\.4\.[0-9]*' target/aarch64-unknown-linux-gnu/release/openidea \
            | sort -uV | tail -3 || true

      - name: Publish to a release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          deb=$(ls target/aarch64-unknown-linux-gnu/release/bundle/deb/*.deb)
          name=$(basename "$deb")
          version=$(sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' src-tauri/tauri.conf.json | head -1)
          tag="v${version}-arm64"
          api="https://api.github.com/repos/${{ github.repository }}"
          auth=(-H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json")

          id=$(curl -fsSL "${auth[@]}" "$api/releases/tags/$tag" 2>/dev/null | sed -n 's/.*"id": *\([0-9][0-9]*\).*/\1/p' | head -1 || true)
          if [ -z "${id:-}" ]; then
            body=$(printf '{"tag_name":"%s","name":"OpenIDEA %s (Debian arm64)","body":"arm64 build for Debian 12+ / Ubuntu 24.04+, compiled on a native aarch64 runner (glibc 2.34 baseline).\\n\\nInstall: sudo apt install ./%s"}' "$tag" "$version" "$name")
            id=$(curl -fsSL -X POST "${auth[@]}" -d "$body" "$api/releases" | sed -n 's/.*"id": *\([0-9][0-9]*\).*/\1/p' | head -1)
          fi
          echo "release id: $id"

          # Replace an asset left by an earlier run.
          old=$(curl -fsSL "${auth[@]}" "$api/releases/$id/assets" | grep -o "\"id\":[0-9]*,\"node_id\":\"[^\"]*\",\"name\":\"$name\"" | sed -n 's/"id":\([0-9]*\).*/\1/p' || true)
          if [ -n "${old:-}" ]; then
            for a in $old; do curl -fsSL -X DELETE "${auth[@]}" "$api/releases/assets/$a"; done
          fi

          curl -fsSL -X POST "${auth[@]}" \
            -H "Content-Type: application/vnd.debian.binary-package" \
            --data-binary @"$deb" \
            "$api/releases/$id/assets?name=$name" > /dev/null
          sha256sum "$deb" | awk '{print $1}' > "$deb.sha256"
          curl -fsSL -X POST "${auth[@]}" \
            -H "Content-Type: text/plain" \
            --data-binary @"$deb.sha256" \
            "$api/releases/$id/assets?name=$name.sha256" > /dev/null
          echo "https://github.com/${{ github.repository }}/releases/download/$tag/$name"